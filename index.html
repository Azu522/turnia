<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f2eb" />
  <title>Turnia — Atención en orden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="autumn.css" />
</head>
<body>
  <div id="app"></div>
  <dialog id="new-ticket-dialog">
    <form id="ticket-form" method="dialog">
      <div class="dialog-heading"><div><span class="eyebrow">AGREGAR A LA FILA</span><h2>Nuevo turno</h2></div><button class="icon-button" value="cancel" aria-label="Cerrar">×</button></div>
      <label>Nombre de la persona<input name="name" placeholder="Ej. María García" maxlength="45" required /></label>
      <label>Tipo de atención<select name="service"><option>Atención general</option><option>Pagos y facturación</option><option>Información</option><option>Trámites</option></select></label>
      <div class="dialog-actions"><button class="button button-light" value="cancel">Cancelar</button><button class="button button-primary" value="default">Crear turno <span>→</span></button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
